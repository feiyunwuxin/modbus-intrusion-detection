[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modbus-replay-simulator"
version = "0.1.0"
description = "Replay IanArffDataset Modbus traffic to a serial port"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15",
    "pyserial>=3.5",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-qt>=4.2"]
# Optional PC-side IDS monitor panel. Adds torch + numpy + sklearn +
# joblib — several hundred MB of wheels — so it's deliberately opt-in.
# Install with: pip install -e ".[ids,dev]"
ids = ["torch>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3"]

[project.scripts]
modbus-replay = "modbus_replay.__main__:main"